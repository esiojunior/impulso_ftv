name: Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceitar licenças e instalar SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto do ZIP
        run: |
          mkdir -p /tmp/projeto
          for z in *.zip; do unzip -q -o "$z" -d /tmp/projeto; done
          find /tmp/projeto -maxdepth 3 | head -30
      - name: Compilar APK
        run: |
          S=$(find /tmp/projeto -name settings.gradle | head -n 1)
          [ -z "$S" ] && { echo "settings.gradle não encontrado no ZIP"; exit 1; }
          cd "$(dirname "$S")"
          gradle --no-daemon :app:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/saida"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/saida/"
      - uses: actions/upload-artifact@v4
        with:
          name: Impulso-Futevolei-Android-APK
          path: saida/app-debug.apk
