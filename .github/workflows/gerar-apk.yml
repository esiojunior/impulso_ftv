name: Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceitar licenças e instalar SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: |
          S=$(find . -name settings.gradle -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$S" ]; then
            echo "ERRO: settings.gradle não encontrado. Arquivos no repositório:"
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$S")
          echo "Projeto encontrado em: $DIR"
          cd "$DIR"
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Impulso-Futevolei-Android-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
